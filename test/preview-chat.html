        if (message.type === 'readClipboardText') setTimeout(() => window.dispatchEvent(new MessageEvent('message', { data: { type: 'clipboardText', requestId: message.requestId, text: '宿主剪贴板文字', truncated: false } })), 0);
      },
    });

    setTimeout(() => {
      const rect = (id) => {
        const node = document.getElementById(id);
        if (!node) return null;
        const box = node.getBoundingClientRect();
        return { left: box.left, right: box.right, width: box.width, visible: box.width > 0 && box.height > 0 };
      };
      document.documentElement.dataset.layoutMetrics = JSON.stringify({
        viewport: { width: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth },
        body: { width: document.body.clientWidth, scrollWidth: document.body.scrollWidth },
        toolbar: rect('modelInput'), profile: rect('profileInput'), mode: rect('modeInput'), skills: rect('skillsButton'), settings: rect('settingsButton'), composer: rect('composer'), permissions: rect('permissionPresetInput'),
        steps: rect('agentMaxStepsInput'), reasoning: rect('reasoningEffortInput'), voice: rect('voiceButton'),
        // 分段交错渲染的契约：正文说明与它触发的步骤必须交替出现，且步骤紧跟在对应说明之后。
        flow: [...(document.querySelector('[data-message-id="m2"] .message-body')?.children || [])]
          .filter((node) => node.classList.contains('message-narration') || node.classList.contains('tool-stack'))
          .map((node) => node.classList.contains('tool-stack')
            ? `steps:${node.querySelectorAll('.tool-execution').length}`
            : `note:${(node.textContent || '').trim().slice(0, 12)}`),
        taskTree: rect('taskTree'), pendingImageCount: document.querySelectorAll('.attachment-chip-image img').length, messageImageCount: document.querySelectorAll('.message-image-attachment img').length, selectedModelLabel: document.querySelector('#modelInput option:checked')?.textContent, commandCopy: [...document.querySelectorAll('.terminal-command button')].map((node) => {
          const box = node.getBoundingClientRect(); return { left: box.left, right: box.right, width: box.width };
        }),
      });
      const copyButton = document.querySelector('.terminal-command button');
      if (copyButton) copyButton.click();
      const toolCopyButton = document.querySelector('.tool-execution.status-pending .tool-detail-heading button');
      if (toolCopyButton) toolCopyButton.click();
      const pasteData = new DataTransfer();
      pasteData.setData('text/plain', '混合剪贴板文字');
      const prompt = document.getElementById('promptInput');
      prompt.focus();
      prompt.dispatchEvent(new ClipboardEvent('paste', { clipboardData: pasteData, bubbles: true, cancelable: true }));
      if (new URLSearchParams(location.search).get('composer') === 'long') {
        prompt.value = Array.from({ length: 14 }, (_, index) => `第 ${index + 1} 行：继续完善输入框布局与运行中任务说明。`).join('\n');
        prompt.dispatchEvent(new Event('input', { bubbles: true }));
        prompt.scrollTop = prompt.scrollHeight;
      }
      const firstMessage = document.querySelector('.message-content p');
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(firstMessage);
      selection.removeAllRanges();
      selection.addRange(range);
      const copiedSelection = new DataTransfer();
      document.dispatchEvent(new ClipboardEvent('copy', { clipboardData: copiedSelection, bubbles: true, cancelable: true }));
      selection.removeAllRanges();
      prompt.focus();
      prompt.setSelectionRange(prompt.value.length, prompt.value.length);
      prompt.dispatchEvent(new KeyboardEvent('keydown', { key: 'v', metaKey: true, bubbles: true, cancelable: true }));
      setTimeout(() => {
        const copyMessages = window.__hwchatMessages.filter((message) => message.type === 'copyText' && message.requestId);
        document.documentElement.dataset.clipboardMetrics = JSON.stringify({
          copiedText: copyMessages[0]?.text || '',
          toolCommandText: copyMessages[1]?.text || '',
          copyButtonText: copyButton?.textContent || '',
          toolCopyButtonText: toolCopyButton?.textContent || '',
          pastedText: prompt.value,
          shortcutCopiedText: copiedSelection.getData('text/plain'),
        });
      }, 240);
    }, 100);
  </script>
</body>
</html>
