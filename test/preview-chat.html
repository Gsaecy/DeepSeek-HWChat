<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../media/chat.css"><title>HWChat Preview</title>
  <style>:root{--vscode-editor-background:#f5f5f7;--vscode-foreground:#1d1d1f;--vscode-sideBar-background:#ececf0;--vscode-button-background:#087af5;--vscode-button-foreground:#fff;--vscode-button-hoverBackground:#006bd6;--vscode-focusBorder:#0a84ff;--vscode-textLink-foreground:#0069c7;--vscode-textCodeBlock-background:#ececf0;--vscode-notifications-background:#fff;--vscode-errorForeground:#d70015}</style>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="historyPane" class="history-pane">
      <div class="brand-row"><img class="brand-mark" src="../resources/logo.png" alt=""><div class="brand-copy"><strong>HWChat</strong><span>DeepSeek workspace</span></div><button id="closeHistoryButton" class="icon-button mobile-only" type="button">☰</button></div>
      <button id="newChatButton" class="primary-command" type="button"><span>＋</span><span>新建对话</span></button>
      <label class="search-field"><span class="sr-only">搜索</span><input id="historySearch" type="search" placeholder="搜索对话"></label>
      <button id="archiveViewButton" class="sidebar-command archive-toggle" type="button"><span>□</span><span>显示归档</span></button>
      <div id="conversationList" class="conversation-list"></div>
      <button id="settingsButtonSide" class="sidebar-command" type="button"><span>⚙</span><span>设置</span></button>
    </aside>
    <main class="chat-pane">
      <header class="chat-toolbar">
        <button id="historyButton" class="icon-button" type="button">☰</button>
        <div class="conversation-heading"><strong id="conversationTitle">新对话</strong><span id="connectionState">准备就绪</span></div>
        <label class="mode-field"><select id="modeInput"><option value="agent">Agent</option><option value="plan">Plan</option><option value="chat">Chat</option></select></label>
        <label class="profile-field"><select id="profileInput"></select></label>
        <label class="model-field"><select id="modelInput"></select></label>
        <button id="skillsButton" class="control-button" type="button"><span>✦</span><span id="skillsCount">0</span></button>
        <button id="archiveButton" class="icon-button" type="button">□</button><button id="exportButton" class="icon-button" type="button">⇧</button><button id="settingsButton" class="icon-button" type="button">⚙</button>
      </header>
      <section id="skillsPanel" class="skills-panel"><div class="skills-panel-heading"><strong>本次对话使用的 Skill</strong><span id="workspaceTrustBadge">工作区状态</span></div><div id="skillsList" class="skills-list"></div><div class="skills-panel-note">默认启用来自快捷调用；回复会显示本轮实际加载的 Skill。</div></section>
      <section id="messageViewport" class="message-viewport">
        <button id="loadOlderButton" class="load-older" type="button" hidden>加载更早消息</button>
        <div id="emptyState" class="empty-state"><img class="empty-mark" src="../resources/logo.png" alt=""><h1>今天想一起解决什么？</h1><div class="suggestions"><button type="button" data-prompt="解释当前代码">解释代码</button><button type="button" data-prompt="设计实现方案">设计方案</button><button type="button" data-prompt="执行代码审查">代码审查</button></div></div>
        <div id="messageList" class="message-list"></div>
      </section>
      <footer class="composer-wrap">
        <div id="attachmentList" class="attachment-list"></div><div id="contextChip" class="context-chip" hidden><span id="contextLabel"></span><button id="removeContextButton" type="button">×</button></div>
        <form id="composer" class="composer"><textarea id="promptInput" rows="1"></textarea><div class="composer-actions"><span id="composerHint">Enter 发送</span><button id="attachButton" class="icon-button" type="button">⌕</button><button id="sendButton" class="send-button" type="submit">↑</button><button id="stopButton" class="stop-button" type="button" hidden>■</button></div></form>
      </footer>
    </main>
  </div><div id="toast" class="toast" hidden></div>
  <script>
    const now=Date.now();
    const previewState={
      conversation:{id:'c1',title:'完成登录模块重构',createdAt:now-500000,updatedAt:now,messageCount:4,preview:'已修改 2 个文件并通过测试',pinned:true,totalTokens:2462,model:'deepseek-reasoner',apiProfileId:'deepseek',mode:'agent',skillIds:['s1','s2'],skillSelectionInitialized:true,archived:false},
      conversations:[{id:'c1',title:'完成登录模块重构',updatedAt:now,messageCount:4,preview:'已修改 2 个文件并通过测试',pinned:true,totalTokens:2462,model:'deepseek-reasoner',mode:'agent'},{id:'c2',title:'排查 Android 构建',updatedAt:now-7200000,messageCount:8,preview:'Gradle 版本需要对齐',pinned:false,totalTokens:18921}],

    window.acquireVsCodeApi=()=>({postMessage(message){if(message.type==='ready')setTimeout(()=>window.dispatchEvent(new MessageEvent('message',{data:{type:'state',state:previewState,streamingConversationId:null}})),0);}});
  </script><script src="../media/chat.js"></script>
</body></html>
