<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../media/settings.css"><title>HWChat Settings Preview</title><style>:root{--vscode-editor-background:#f5f5f7;--vscode-foreground:#1d1d1f;--vscode-sideBar-background:#ececf0;--vscode-button-background:#087af5;--vscode-button-foreground:#fff;--vscode-focusBorder:#0a84ff;--vscode-notifications-background:#fff;--vscode-errorForeground:#d70015}</style></head><body>
<div class="settings-shell"><aside class="settings-sidebar"><div class="settings-brand"><img src="../resources/logo.png" alt=""><strong>HWChat</strong></div><nav><button data-target="connection" class="active">连接</button><button data-target="generation">生成</button><button data-target="agent">Agent</button><button data-target="skills">Skills</button><button data-target="privacy">权限与隐私</button><button data-target="storage">存储</button></nav><button id="nativeSettingsButton" class="native-settings">VS Code 设置</button></aside>
<main class="settings-main"><header class="settings-toolbar"><div><h1>设置</h1><span id="saveState">所有更改已保存</span></div><div class="toolbar-actions"><button id="testButton">测试连接</button><button id="saveButton" class="primary">保存</button></div></header><div class="settings-content">
<section id="connection" class="settings-section"><div class="section-heading"><h2>连接</h2><span id="keyState" class="status-pill">未配置</span></div><div class="settings-group"><div class="setting-row"><span><strong>API 配置档</strong><small>每个服务独立保存地址、模型和密钥</small></span><span class="profile-control"><select id="profileSelect" class="control"></select><button id="addProfileButton">＋</button><button id="deleteProfileButton">−</button></span></div><label class="setting-row"><span><strong>配置名称</strong></span><input id="profileName" class="control"></label><label class="setting-row"><span><strong>API Key</strong><small>保存在 VS Code SecretStorage</small></span><span class="control api-key-control"><input id="apiKey" type="password"><button id="clearKeyButton">清除</button></span></label><label class="setting-row"><span><strong>接口地址</strong><small>OpenAI 兼容 Base URL</small></span><input id="baseUrl" class="control"></label><label class="setting-row"><span><strong>默认模型</strong></span><input id="model" class="control mono"></label><label class="setting-row setting-row-stack"><span><strong>可选模型</strong><small>每行一个模型名</small></span><textarea id="profileModels" class="control mono"></textarea></label><label class="setting-row setting-row-stack"><span><strong>额外请求头</strong></span><textarea id="requestHeaders" class="control"></textarea></label><label class="setting-row"><span><strong>请求超时</strong></span><span class="stepper"><input id="requestTimeoutSeconds" type="number"><span>秒</span></span></label></div></section>
<section id="generation" class="settings-section"><div class="section-heading"><h2>生成</h2></div><div class="settings-group"><label class="setting-row"><span><strong>温度</strong></span><span class="range-control"><input id="temperature" type="range" min="0" max="2" step=".1"><output id="temperatureValue"></output></span></label><label class="setting-row"><span><strong>最大输出</strong></span><span class="stepper"><input id="maxTokens"><span>tokens</span></span></label><label class="setting-row"><span><strong>上下文消息</strong></span><span class="stepper"><input id="maxMessagesInContext"><span>条</span></span></label><label class="setting-row"><span><strong>回车发送</strong></span><input id="sendOnEnter" class="switch" type="checkbox"></label><label class="setting-row setting-row-stack"><span><strong>系统提示词</strong></span><textarea id="systemPrompt" class="control"></textarea></label></div></section>
<section id="agent" class="settings-section"><div class="section-heading"><h2>Agent</h2><span id="trustState" class="status-pill">状态</span></div><div class="settings-group"><label class="setting-row"><span><strong>默认模式</strong></span><select id="defaultMode" class="control"><option value="agent">Agent</option><option value="plan">Plan</option><option value="chat">Chat</option></select></label><label class="setting-row"><span><strong>最大执行步骤</strong></span><span class="stepper"><input id="agentMaxSteps"><span>步</span></span></label><label class="setting-row"><span><strong>命令超时</strong></span><span class="stepper"><input id="maxCommandSeconds"><span>秒</span></span></label><label class="setting-row"><span><strong>单文件读取上限</strong></span><span class="stepper"><input id="maxReadBytes"><span>bytes</span></span></label><label class="setting-row"><span><strong>工具输出上限</strong></span><span class="stepper"><input id="maxToolOutputBytes"><span>bytes</span></span></label></div></section>
<section id="skills" class="settings-section"><div class="section-heading"><h2>Skills</h2><span id="skillCount" class="section-value">0 个</span></div><div id="skillSummaryList" class="skill-summary-list"></div><div class="storage-actions"><button id="rescanSkillsButton">重新扫描</button><button id="openSkillFolderButton">打开用户 Skill 目录</button></div></section>
<section id="privacy" class="settings-section"><div class="section-heading"><h2>权限与隐私</h2><span class="status-pill configured">无遥测</span></div><div class="privacy-summary"><strong>数据流向</strong><p>消息、明确添加的文件、启用的 Skill 和必要工具结果仅发送到配置的模型接口。</p></div><div class="settings-group"><label class="setting-row"><span><strong>权限预设</strong><small>Autopilot 自动执行工作区内常规操作</small></span><select id="permissionPreset" class="control"><option value="askAll">每次询问</option><option value="review">风险操作询问</option><option value="autopilot">Autopilot</option><option value="full">完全访问</option><option value="custom">自定义</option></select></label><label class="setting-row"><span><strong>读取文件</strong></span><select id="fileReadPolicy" class="control"><option value="allow">自动允许</option><option value="ask">每次询问</option><option value="deny">禁止</option></select></label><label class="setting-row"><span><strong>修改文件</strong></span><select id="fileWritePolicy" class="control"><option value="ask">每次询问</option><option value="allow">自动允许</option><option value="deny">禁止</option></select></label><label class="setting-row"><span><strong>运行命令</strong></span><select id="commandPolicy" class="control"><option value="ask">每次询问</option><option value="allow">自动允许</option><option value="deny">禁止</option></select></label><label class="setting-row"><span><strong>允许敏感文件</strong></span><input id="allowSensitiveFiles" class="switch" type="checkbox"></label><label class="setting-row"><span><strong>允许危险命令</strong></span><input id="allowDangerousCommands" class="switch" type="checkbox"></label><label class="setting-row"><span><strong>审计记录保留</strong></span><span class="stepper"><input id="auditRetentionDays"><span>天</span></span></label></div><div class="danger-zone"><div><strong>删除本地数据</strong><span>删除全部对话和审计记录</span></div><button id="clearLocalDataButton">全部删除</button></div></section>
<section id="storage" class="settings-section"><div class="section-heading"><h2>存储</h2><span id="storageSize" class="section-value">0 MB</span></div><div class="storage-meter"><span id="storageMeterFill"></span></div><div class="stats-row"><span><strong id="conversationCount">0</strong> 对话</span><span><strong id="messageCount">0</strong> 消息</span></div><div class="settings-group"><label class="setting-row"><span><strong>对话保留</strong></span><span class="stepper"><input id="historyRetentionDays"><span>天</span></span></label><label class="setting-row"><span><strong>任务缓存保留</strong></span><span class="stepper"><input id="taskCacheRetentionHours"><span>小时</span></span></label><label class="setting-row"><span><strong>缓存上限</strong></span><span class="stepper"><input id="cacheBudgetMB"><span>MB</span></span></label><label class="setting-row"><span><strong>清理间隔</strong></span><span class="stepper"><input id="cleanupIntervalMinutes"><span>分钟</span></span></label></div><div class="storage-actions"><button id="cleanupButton">立即清理</button><button id="exportAllButton">导出全部对话</button></div></section>
</div></main></div><div id="toast" class="toast" hidden></div>
<script>const settings={apiProfiles:[{id:'deepseek',name:'DeepSeek',baseUrl:'https://api.deepseek.com',models:['deepseek-chat','deepseek-reasoner'],requestHeaders:{}},{id:'local',name:'本地 Ollama',baseUrl:'http://localhost:11434/v1',models:['qwen3-coder'],requestHeaders:{}}],activeApiProfileId:'deepseek',baseUrl:'https://api.deepseek.com',model:'deepseek-reasoner',requestHeaders:{},requestTimeoutSeconds:120,temperature:.7,maxTokens:8192,maxMessagesInContext:30,sendOnEnter:true,systemPrompt:'你是一名严谨的软件工程助手。',historyRetentionDays:30,taskCacheRetentionHours:24,cacheBudgetMB:100,cleanupIntervalMinutes:10,defaultMode:'agent',agentMaxSteps:12,permissionPreset:'autopilot',fileReadPolicy:'allow',fileWritePolicy:'allow',commandPolicy:'allow',allowSensitiveFiles:false,allowDangerousCommands:false,maxReadBytes:512000,maxToolOutputBytes:200000,maxCommandSeconds:120,auditRetentionDays:30};window.acquireVsCodeApi=()=>({postMessage(m){if(m.type==='ready')setTimeout(()=>window.dispatchEvent(new MessageEvent('message',{data:{type:'state',settings,apiKeyConfigured:true,apiKeyConfiguredByProfile:{deepseek:true,local:false},stats:{bytes:24681012,conversations:42,messages:618},skills:[{name:'项目文档同步',description:'代码改动后同步 README 与技术文档',relativePath:'~/.copilot/skills/project-doc-sync/SKILL.md',defaultEnabled:true,lastUsedAt:Date.now()},{name:'安全审查',description:'检查凭据、权限和输入边界',relativePath:'.hwchat/skills/security.md'}],workspaceTrusted:true,workspaceFolderCount:1}})),0);}});</script><script src="../media/settings.js"></script></body></html>
