<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWChat · 归档胶囊 / 面板内审批 预览</title>
  <link rel="stylesheet" href="../media/chat.css">
  <style>
    /* 只用截图检查横向滚动胶囊栏和审批卡片的可读性。 */
    body { padding: 14px; background: var(--bg); }
    .preview-frame { width: 420px; max-width: 100%; margin: 0 0 18px; border: 1px dashed var(--border); border-radius: 8px; padding: 10px; }
    .preview-label { margin: 0 0 6px; color: var(--muted); font-size: 10px; }
    .demo-composer { width: min(850px, 100%); margin: 0 auto; }
  </style>
</head>
<body>
  <div class="preview-frame" id="frame-narrow">
    <p class="preview-label">窄栏 + 12 颗胶囊（保持尺寸；无滚动条，滚轮或按住拖动横向滚动）</p>
    <div class="demo-composer">
      <div class="todo-archive-bar" id="bar-narrow"></div>
    </div>
  </div>

  <div class="preview-frame" id="frame-wide">
    <p class="preview-label">宽栏 + 3 颗胶囊（固定高度 10.67px）</p>
    <div class="demo-composer">
      <div class="todo-archive-bar" id="bar-wide"></div>
    </div>
  </div>

  <div class="preview-frame">
    <p class="preview-label">面板内审批卡片</p>
    <div class="demo-composer">
      <section class="approval-card" data-risk="write">
        <div class="approval-heading"><span class="approval-badge" aria-hidden="true"></span><strong>允许 Agent 修改文件？</strong></div>
        <p class="approval-summary">修改文件：src/views/chatPanel.ts</p>
        <details class="approval-detail"><summary>查看详情</summary><pre>目标：src/views/chatPanel.ts
精确替换：120 -> 340 字符</pre></details>
        <div class="approval-actions">
          <button type="button">拒绝</button>
          <button type="button" class="approval-allow">允许一次</button>
        </div>
      </section>
    </div>
  </div>

  <div class="preview-frame">
    <p class="preview-label">展开的归档清单（虚线边框 + 已归档标题）</p>
    <div class="demo-composer">
      <details class="todo-panel archived" open>
        <summary><span>已归档任务清单</span><small>已归档 · 11:52 · 2/2 完成</small></summary>
        <ol class="todo-list">
          <li class="todo-item status-completed"><span class="todo-index">1</span><span class="todo-content">读代码</span><span class="todo-status status-completed">✓</span></li>
          <li class="todo-item status-completed"><span class="todo-index">2</span><span class="todo-content">改实现</span><span class="todo-status status-completed">✓</span></li>
        </ol>
      </details>
    </div>
  </div>

  <script>
    // 与 media/chat.js 的 archiveColorHex 同样的锚点，仅用于截图对比。
    const STOPS = [[0, [46, 160, 67]], [0.5, [74, 168, 224]], [1, [30, 79, 216]]];
    function colorHex(ratio) {
      const r = Math.min(1, Math.max(0, ratio));
      let upper = 1;
      while (upper < STOPS.length - 1 && r > STOPS[upper][0]) upper += 1;
      const [fromAt, fromColor] = STOPS[upper - 1];
      const [toAt, toColor] = STOPS[upper];
      const local = (r - fromAt) / (toAt - fromAt);
      const ch = (i) => Math.round(fromColor[i] + (toColor[i] - fromColor[i]) * local).toString(16).padStart(2, '0');
      return `#${ch(0)}${ch(1)}${ch(2)}`;
    }
    function fill(bar, count) {
      bar.replaceChildren();
      for (let index = 0; index < count; index += 1) {
        const capsule = document.createElement('button');
        capsule.type = 'button';
        capsule.className = 'todo-capsule';
        capsule.style.backgroundColor = colorHex(count <= 1 ? 0 : index / (count - 1));
        bar.append(capsule);
      }
    }

    const narrow = document.getElementById('bar-narrow');
    const wide = document.getElementById('bar-wide');
    fill(narrow, 12);
    fill(wide, 3);
    // 下面两段是 media/chat.js 里滚轮映射与 bindTodoArchiveDrag 的等价镜像：
    // 这个预览页不加载 chat.js（它要扩展注入的 API），复制一份才能真的滚起来。
    // 行为以 chat.js 为准，改那边记得同步这里。
    for (const bar of [narrow, wide]) {
      bar.addEventListener('wheel', (event) => {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        const maxScroll = bar.scrollWidth - bar.clientWidth;
        if (maxScroll <= 0) return;
        const movingLeft = event.deltaY < 0;
        if ((movingLeft && bar.scrollLeft <= 0) || (!movingLeft && bar.scrollLeft >= maxScroll)) return;
        event.preventDefault();
        bar.scrollLeft = Math.min(maxScroll, Math.max(0, bar.scrollLeft + event.deltaY));
      }, { passive: false });

      // 按住拖动：滚动条是隐藏的，这是第二种滚法（触屏走浏览器原生滚动）。
      // 指针捕获要等确认拖动之后再设，否则 click 会被改派给栏，胶囊点不动。
      let pointerId = null;
      let startX = 0;
      let startScrollLeft = 0;
      let captured = false;
      bar.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'touch' || event.button !== 0) return;
        pointerId = event.pointerId;
        startX = event.clientX;
        startScrollLeft = bar.scrollLeft;
        captured = false;
        delete bar.dataset.dragMoved;
      });
      bar.addEventListener('pointermove', (event) => {
        if (pointerId === null || event.pointerId !== pointerId) return;
        const dx = event.clientX - startX;
        if (bar.dataset.dragMoved !== '1' && Math.abs(dx) < 3) return;
        bar.dataset.dragMoved = '1';
        bar.classList.add('dragging');
        if (!captured) { captured = true; bar.setPointerCapture(event.pointerId); }
        bar.scrollLeft = startScrollLeft - dx;
        event.preventDefault();
      });
      const release = (event) => {
        if (pointerId === null) return;
        if (event && event.pointerId !== undefined && event.pointerId !== pointerId) return;
        pointerId = null;
        bar.classList.remove('dragging');
        if (captured && bar.hasPointerCapture(event.pointerId)) {
          captured = false;
          bar.releasePointerCapture(event.pointerId);
        }
      };
      bar.addEventListener('pointerup', release);
      bar.addEventListener('pointercancel', release);
      bar.addEventListener('lostpointercapture', release);
      // 拖动后的那个 click 不算点击（chat.js 里由 consumeArchiveDragClick 吞掉）。
      bar.addEventListener('click', (event) => {
        if (bar.dataset.dragMoved !== '1') return;
        delete bar.dataset.dragMoved;
        event.preventDefault();
        event.stopPropagation();
      }, true);
    }
  </script>
</body>
</html>
